<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Assistant</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body { background: #f8f9fa; }
    .app-shell { height: 100vh; }
    .chat-scroll { height: calc(100vh - 210px); overflow-y: auto; }
    .bubble { max-width: 65%; width: fit-content; padding: 6px 10px; border-radius: 10px; margin-bottom: 8px; white-space: pre-wrap; font-size: 0.92rem;}
    .bubble-user { margin-left: auto; background: #0d6efd; color: white; }
    .bubble-assistant { margin-right: auto; background: #e9ecef; color: #212529; }
    .recommendation-card { border-left: 4px solid #198754; }
    .small-muted { font-size: 0.85rem; color: #6c757d; }
  </style>
</head>
<body>
  <div class="container-fluid app-shell py-3">
    <div class="row g-3 h-100">
      <!-- Left: Chat -->
      <div class="col-12 col-lg-8 d-flex flex-column">
        <div class="card shadow-sm flex-grow-1">
          <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Financial Chatbot</strong>
            <div class="d-flex align-items-center gap-2">
              <select id="langSelect" class="form-select form-select-sm" style="width: 160px;">
                <option value="en" selected>English</option>
                <option value="vi">Vietnamese</option>
                <option value="zh">Chinese</option>
              </select>
              <span id="sessionBadge" class="badge text-bg-secondary">No session</span>
            </div>
          </div>
          <div id="chatList" class="card-body chat-scroll"></div>
          <div class="card-footer">
            <form id="chatForm" class="d-flex gap-2">
              <input id="chatInput" class="form-control" placeholder="Type your message..." required />
              <button id="sendBtn" class="btn btn-primary" type="submit">Send</button>
            </form>
            <div class="small-muted mt-2">
              Backend: <code id="apiBaseLabel"></code>
            </div>
          </div>
        </div>

        <div id="recommendationArea" class="mt-3"></div>
      </div>

      <!-- Right: Profile / Progress -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm mb-3">
          <div class="card-header"><strong>Progress</strong></div>
          <div class="card-body">
            <div class="mb-2"><span class="small-muted">State:</span> <span id="stateValue">-</span></div>
            <div class="mb-2"><span class="small-muted">Task Mode:</span> <span id="taskModeValue">-</span></div>
            <div class="mb-2"><span class="small-muted">Next Item:</span> <span id="nextItemValue">-</span></div>
            <div class="mb-2">
              <span class="small-muted">Ready for Recommendation:</span>
              <span id="readyValue" class="badge text-bg-secondary">false</span>
            </div>
            <div class="mb-2"><span class="small-muted">Detected Language:</span> <span id="langValue">-</span></div>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header"><strong>Collected Profile</strong></div>
          <div class="card-body">
            <pre id="collectedJson" class="mb-0 small">{}</pre>
          </div>
        </div>

        <button id="resetBtn" class="btn btn-outline-danger w-100 mt-3">Reset Local Session</button>
      </div>
    </div>
  </div>

  <script>
    // Can be overridden by a script tag before app.js loads
    window.APP_API_BASE = window.APP_API_BASE || "http://127.0.0.1:8000";
  </script>
  <script src="./app.js"></script>
</body>
</html>
