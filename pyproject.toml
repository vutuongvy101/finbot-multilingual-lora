[project]
name = "financialbot"
version = "0.1.0"
description = "Policy-driven financial chatbot (FastAPI + simple frontend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
llm = [
  "transformers>=4.44.0",
  "torch>=2.2.0",
  "accelerate>=0.33.0",
  "peft>=0.12.0",
]
rag = [
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"