<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinBot — Financial Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --primary:        #4F46E5;
      --primary-dark:   #3730A3;
      --primary-light:  #EEF2FF;
      --accent:         #06B6D4;
      --success:        #10B981;
      --danger:         #EF4444;
      --bg:             #F1F5F9;
      --surface:        #FFFFFF;
      --border:         #E2E8F0;
      --text:           #0F172A;
      --text-muted:     #64748B;
      --bubble-user-bg: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
      --bubble-bot-bg:  #FFFFFF;
      --header-h:       64px;
      --footer-h:       80px;
    }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .app-shell {
      display: grid;
      grid-template-columns: 1fr 340px;
      grid-template-rows: var(--header-h) 1fr;
      height: 100vh;
      gap: 0;
    }

    @media (max-width: 991px) {
      .app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: var(--header-h) 1fr auto;
      }
    }

    /* ── Top Navigation Bar ── */
    .topbar {
      grid-column: 1 / -1;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .topbar-controls select {
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 0.3rem 0.6rem;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .topbar-controls select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }

    /* ── Chat Area ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.25rem;
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    .chat-scroll::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }

    /* ── Message Row ── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 0.6rem;
      margin-bottom: 1rem;
      animation: fadeUp 0.2s ease both;
    }
    .msg-row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatar ── */
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
    }
    .avatar-bot {
      background: var(--primary-light);
      color: var(--primary);
    }
    .avatar-user {
      background: var(--primary);
      color: #fff;
    }

    /* ── Bubble ── */
    .bubble {
      max-width: 62%;
      padding: 0.7rem 1rem;
      border-radius: 18px;
      font-size: 0.88rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }

    .bubble-user {
      background: var(--bubble-user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble-assistant {
      background: var(--bubble-bot-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }

    .bubble-assistant.has-recommendation {
      max-width: min(90%, 780px);
      width: 100%;
    }

    /* ── Typing indicator ── */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
    }
    .typing-dots span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 2.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.64s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40%           { transform: scale(1);   opacity: 1; }
    }

    .loading-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 6px;
    }
    .loading-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }
    .context-marker-row {
      display: flex;
      justify-content: center;
      margin: 0.5rem 0 1rem;
      animation: fadeUp 0.2s ease both;
    }
    .context-marker {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(148, 163, 184, 0.12);
      border: 1px dashed var(--border);
      border-radius: 999px;
      padding: 0.3rem 0.65rem;
      max-width: 90%;
      text-align: center;
      white-space: normal;
    }

    /* ── Input footer ── */
    .chat-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
    }

    .input-row {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .input-row input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 1rem;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: var(--bg);
      color: var(--text);
    }
    .input-row input::placeholder { color: var(--text-muted); }
    .input-row input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
      background: var(--surface);
    }

    .btn-send {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .btn-send:hover  { background: var(--primary-dark); }
    .btn-send:active { transform: scale(0.95); }
    .btn-send:disabled { background: #A5B4FC; cursor: not-allowed; }
    .btn-send svg { width: 18px; height: 18px; }

    .footer-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }
    .footer-meta code { font-size: 0.75rem; color: var(--text-muted); }

    /* ── Side Panel ── */
    .side-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .side-panel-inner {
      flex: 1;
      overflow-y: auto;
      padding: 1.1rem 1rem;
    }
    .side-panel-inner::-webkit-scrollbar { width: 4px; }
    .side-panel-inner::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }

    .side-section { margin-bottom: 1.25rem; }
    .side-section-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.65rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0;
      font-size: 0.82rem;
    }
    .stat-label { color: var(--text-muted); }
    .stat-val   { font-weight: 500; color: var(--text); max-width: 60%; text-align: right; word-break: break-all; }

    .badge-pill {
      display: inline-block;
      padding: 0.2em 0.65em;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .badge-ready   { background: #D1FAE5; color: #065F46; }
    .badge-pending { background: #F1F5F9; color: var(--text-muted); }
    .badge-session { background: var(--primary-light); color: var(--primary); }

    .collected-pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 0.74rem;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
      margin: 0;
    }

    .btn-reset {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: calc(100% - 2rem);
      margin: 0 1rem 1rem;
      padding: 0.55rem;
      border: 1px solid var(--danger);
      border-radius: 10px;
      background: transparent;
      color: var(--danger);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-reset:hover { background: #FEF2F2; }
    .btn-reset svg { width: 14px; height: 14px; }

    /* ── Recommendation Card ── */
    .recommendation-card {
      border: 0;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(16,185,129,.10);
      margin-top: 0.6rem;
    }
    .recommendation-header {
      background: linear-gradient(135deg, #059669 0%, #10B981 100%);
      color: #fff;
      padding: 0.5rem 0.85rem;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .recommendation-header h5 {
      font-size: 0.82rem;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
    }
    .recommendation-subtitle {
      opacity: 0.85;
      font-size: 0.74rem;
      margin: 0;
    }
    .recommendation-body { padding: 0.45rem; background: var(--surface); }
    .recommendation-grid {
      display: grid;
      gap: 0.35rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .recommendation-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
    }
    .recommendation-item-wide { grid-column: 1 / -1; }
    .recommendation-item h6 {
      font-size: 0.63rem;
      color: var(--text-muted);
      margin: 0 0 0.15rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .recommendation-item p {
      margin-bottom: 0;
      color: var(--text);
      font-size: 0.8rem;
      white-space: pre-wrap !important;
      line-height: 1.5;
    }
    .analysis-details { margin: 0; }
    .analysis-details summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }
    .analysis-details summary::-webkit-details-marker { display: none; }
    .analysis-details summary h6 {
      margin-bottom: 0;
      display: inline;
    }
    .analysis-details summary::before {
      content: "▶";
      font-size: 0.55rem;
      color: var(--text-muted);
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .analysis-details[open] summary::before { transform: rotate(90deg); }
    .analysis-details p { margin-top: 0.4rem; margin-bottom: 0; }

    .source-badges { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .source-chip {
      border: 1px solid var(--success);
      color: var(--success);
      background: #fff;
      border-radius: 999px;
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      line-height: 1.2;
    }

    @media (max-width: 991px) {
      .app-shell { grid-template-columns: 1fr; }
      .side-panel { border-left: none; border-top: 1px solid var(--border); max-height: 360px; }
      .recommendation-grid { grid-template-columns: 1fr; }
      .bubble { max-width: 82%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- ── Top Bar ── -->
    <header class="topbar">
      <a class="topbar-brand" href="#">
        <div class="brand-icon">
          <!-- chart icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </div>
        FinBot
      </a>

      <div class="topbar-controls">
        <select id="modelSelect" aria-label="Model">
          <option value="lora-qwen25-1p5b-finbot-v2" selected>LoRA Qwen 2.5 1.5B FinBot v2</option>
          <option value="Qwen/Qwen2.5-1.5B-Instruct">Qwen 2.5 1.5B</option>
        </select>
        <select id="langSelect" aria-label="Language">
          <option value="en" selected>English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="zh">中文</option>
        </select>
        <span id="sessionBadge" class="badge-pill badge-session">No session</span>
      </div>
    </header>

    <!-- ── Chat Panel ── -->
    <main class="chat-panel">
      <div id="chatList" class="chat-scroll"></div>
      <footer class="chat-footer">
        <form id="chatForm">
          <div class="input-row">
            <input id="chatInput" type="text" placeholder="Ask me about your finances…" autocomplete="off" required />
            <button id="sendBtn" class="btn-send" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </form>
        <p class="footer-meta">Backend: <code id="apiBaseLabel"></code></p>
      </footer>
    </main>

    <!-- ── Side Panel ── -->
    <aside class="side-panel">
      <div class="side-panel-inner">

        <div class="side-section">
          <p class="side-section-title">Session Status</p>
          <div class="stat-row">
            <span class="stat-label">State</span>
            <span class="stat-val" id="stateValue">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Task Mode</span>
            <span class="stat-val" id="taskModeValue">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Next Item</span>
            <span class="stat-val" id="nextItemValue">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Language</span>
            <span class="stat-val" id="langValue">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Ready</span>
            <span id="readyValue" class="badge-pill badge-pending">false</span>
          </div>
        </div>

        <div class="side-section">
          <p class="side-section-title">Collected Profile</p>
          <pre id="collectedJson" class="collected-pre">{}</pre>
        </div>

      </div>
      <button id="resetBtn" class="btn-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
        </svg>
        Reset Session
      </button>
    </aside>

  </div>

  <script src="./config.js" onerror="void 0"></script>
  <script>
    window.APP_API_BASE = window.APP_API_BASE || "http://127.0.0.1:8000";
  </script>
  <script src="./app.js"></script>
</body>
</html>
