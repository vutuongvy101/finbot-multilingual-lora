services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FINBOT_LLM_BACKEND: ${FINBOT_LLM_BACKEND:-local}
      FINBOT_VLLM_BASE_URL: ${FINBOT_VLLM_BASE_URL:-http://vllm:8000/v1}
      HF_CACHE_DIR: /root/.cache/huggingface/hub
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/frontend-config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      backend:
        condition: service_healthy

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    ports:
      - "8001:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    command: >
      --model ${FINBOT_BASE_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      --enable-lora
      --lora-modules finbot=${FINBOT_ADAPTER_REPO:-bibbbu/lora-qwen25-1p5b-finbot-v2}
      --max-lora-rank 32
      --dtype auto
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf_cache:
